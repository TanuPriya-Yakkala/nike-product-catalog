spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/product_catalog}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
server:
  port: 8080
